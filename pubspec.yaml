name: syncresto_print
description: "SyncResto Print — Online sipariş yazıcı uygulaması (Marketplace + Web siparişleri otomatik fişe basar)"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Network + state + storage
  dio: ^5.9.1
  shared_preferences: ^2.5.4
  socket_io_client: ^3.0.2
  intl: ^0.19.0
  # Yazıcı (ESC/POS termal)
  esc_pos_utils: ^1.1.0
  # Log servisi için (LogService dependency'leri)
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.3
  path_provider: ^2.1.5
  # 18 May 2026 — yeni ozellikler
  sqflite_common_ffi: ^2.3.6        # Print queue (offline-first, masaustu icin FFI)
  audioplayers: ^6.5.0              # Ses bildirimi (yeni sipariş)
  url_launcher: ^6.3.2              # Auto-update download URL
  http: ^1.5.0                      # Update version check (Dio yerine basit GET)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/sounds/new_order.mp3

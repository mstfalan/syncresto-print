name: Windows Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from pubspec
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      # Bu adim YEDEK (safety-net). Asil kopyalama CMake InstallRequiredSystemLibraries'te.
      # Build'i ASLA dusurmemeli (continue-on-error) — gercek kontrolu "Verify runtime DLLs" yapar.
      - name: Bundle VC++ runtime DLLs (fallback + safety-net)
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $rel = "build\\windows\\x64\\runner\\Release"
          function Get-HighestVersionDir($parent) {
            if (-not (Test-Path $parent)) { return $null }
            Get-ChildItem -Path $parent -Directory -ErrorAction SilentlyContinue |
              ForEach-Object {
                $v = $null
                if ([System.Version]::TryParse($_.Name, [ref]$v)) { [pscustomobject]@{ Ver = $v; Path = $_.FullName } }
              } | Sort-Object Ver -Descending | Select-Object -First 1 -ExpandProperty Path
          }
          function Find-CrtDir($x64Root) {
            if (-not (Test-Path $x64Root)) { return $null }
            Get-ChildItem -Path $x64Root -Directory -Filter "Microsoft.VC*.CRT" -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty FullName
          }
          $crtDir = $null
          if ($env:VCToolsRedistDir) { $crtDir = Find-CrtDir (Join-Path $env:VCToolsRedistDir "x64") }
          if (-not $crtDir) {
            $vswhere = "${env:ProgramFiles(x86)}\\Microsoft Visual Studio\\Installer\\vswhere.exe"
            if (Test-Path $vswhere) {
              $vsPath = & $vswhere -latest -products * -property installationPath
              if ($vsPath) {
                $verDir = Get-HighestVersionDir "$vsPath\\VC\\Redist\\MSVC"
                if ($verDir) { $crtDir = Find-CrtDir "$verDir\\x64" }
              }
            }
          }
          if ($crtDir -and (Test-Path $crtDir)) {
            Write-Host "CRT redist kaynagi: $crtDir"
            Copy-Item -Path "$crtDir\\*.dll" -Destination $rel -Force
            Write-Host "Kopyalanan CRT DLL'leri:"
            Get-ChildItem "$rel\\*140*.dll" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name)" }
          } else {
            Write-Host "::warning::CRT redist klasoru bulunamadi; CMake kopyasina guveniliyor. Guard dogrulayacak."
          }

      - name: Create self-signed certificate and sign exe
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Subject "CN=SyncResto, O=SyncResto, C=TR" `
            -Type CodeSigningCert `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -NotAfter (Get-Date).AddYears(3)

          $thumbprint = $cert.Thumbprint
          Write-Host "Cert Thumbprint: $thumbprint"

          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]($_.Directory.Parent.Name) } -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          Write-Host "signtool: $signtool"

          $exePath = Get-ChildItem "build\windows\x64\runner\Release\*.exe" | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "Signing: $exePath"

          & $signtool sign `
            /fd SHA256 `
            /td SHA256 `
            /tr "http://timestamp.digicert.com" `
            /sha1 $thumbprint `
            /d "SyncResto Print" `
            /du "https://syncresto.com" `
            "$exePath"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "signtool sign basarisiz oldu (exit $LASTEXITCODE)"
            exit 1
          }

          Write-Host "--- Imza bilgisi ---"
          & $signtool verify /v "$exePath" 2>&1 | Out-Host
          $LASTEXITCODE = 0

      - name: Create zip package
        shell: pwsh
        run: |
          cd build/windows/x64/runner/Release
          Compress-Archive -Path * -DestinationPath ../../../../../SyncResto-Print-Windows.zip -Force

      - name: Verify runtime DLLs are in the zip (DLL yoksa veya x64 degilse build FAIL)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $required = @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")
          $extract = Join-Path $env:RUNNER_TEMP "zipcheck"
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive -Path "SyncResto-Print-Windows.zip" -DestinationPath $extract -Force
          function Get-PeMachine([string]$path) {
            $bytes = [System.IO.File]::ReadAllBytes($path)
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            return [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          }
          $exe = Get-ChildItem -Path $extract -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { Write-Host "::error::exe zip'te bulunamadi"; exit 1 }
          $root = $exe.DirectoryName
          Write-Host "Exe kok klasoru: $root"
          $missing = @()
          foreach ($dll in $required) {
            $p = Join-Path $root $dll
            if (-not (Test-Path $p)) { $missing += $dll; continue }
            $m = Get-PeMachine $p
            if ($m -ne 0x8664) { Write-Host "::error::$dll x64 DEGIL (machine=0x$($m.ToString('x')))"; exit 1 }
            if ((Get-Item $p).Length -eq 0) { Write-Host "::error::$dll bos (0 byte)"; exit 1 }
          }
          if ($missing.Count -gt 0) {
            Write-Host "::error::VC++ runtime DLL(ler) exe kokunde EKSIK: $($missing -join ', ')"
            Get-ChildItem -Path $root -Filter *.dll | ForEach-Object { Write-Host "  $($_.Name)" }
            exit 1
          }
          Write-Host "OK: Tum ZORUNLU VC++ runtime DLL'leri x64 ve exe kokunde:"
          foreach ($dll in $required) { Write-Host "  [x] $dll" }

      - name: Calculate SHA-256 checksum
        id: checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path "SyncResto-Print-Windows.zip" -Algorithm SHA256).Hash
          Write-Host "SHA256: $hash"
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload Windows Build (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SyncResto-Print-Windows
          path: SyncResto-Print-Windows.zip
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: SyncResto Print v${{ steps.version.outputs.version }} (build ${{ github.run_number }})
          body: |
            ## SyncResto Print v${{ steps.version.outputs.version }}

            Online sipariş termal yazıcı uygulaması — Web ve marketplace siparişleri otomatik fişe basar.

            ### Windows Kurulum
            1. `SyncResto-Print-Windows.zip` indir + çıkart
            2. `syncresto_print.exe`'yi çalıştır
            3. Setup ekranında admin panelden aldığın `SR_PRT_xxx` print key'i gir
            4. Yazıcı Ayarları'ndan termal yazıcı(lar)ı kontrol et + test fişi at
            5. Sipariş geldiğinde otomatik fişe basar — ürün → yazıcı eşleştirmesi `panel.syncresto.com → POS → Ürünler` sayfasından

            ### Özellikler
            - Online sipariş otomatik yazdırma (web + Getir + Trendyol + Yemeksepeti + Migros)
            - Çoklu yazıcı routing (her ürün kendi yazıcısına — POS pattern)
            - SQLite print queue + 5sn arka plan retry (offline-first)
            - Yazıcı fail pop-up + manuel tekrar yazdır
            - Yazıcı atanmamış ürün uyarısı (kullanıcı panelden eşleştirir)
            - İptal fişi (POS pattern)
            - Sesli bildirim (açılıp kapatılabilir)
            - Otomatik güncelleme kontrolü
            - ESC/POS termal yazıcı (TCP/IP port 9100, 80mm)

            ### İmza
            - Self-signed (SyncResto)
            - SHA-256: `${{ steps.checksum.outputs.sha256 }}`
          files: SyncResto-Print-Windows.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
